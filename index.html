<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17171b">
  <meta name="description" content="Vullnet Ameti — Building ideas, systems, and communities that create real impact.">
  <title>Vullnet Ameti — Let's Connect</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="styles.css?v=954f970451a8">
</head>
<body>
  <main class="hero">
    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Vullnet Ameti</h1>
      <p class="tagline">Building ideas, systems, and communities that create <span class="tagline-ending">real impact.</span></p>
      <div class="rule" aria-hidden="true"></div>
      <button id="open-form" class="button" type="button" aria-expanded="false" aria-controls="contact-panel">Let’s Connect <img class="icon" src="arrow-right.svg" alt="" aria-hidden="true"></button>
      <section id="contact-panel" class="contact-panel" aria-label="Contact form" hidden>
        <div class="panel-heading"><h2>Let’s Connect</h2><button id="close-form" type="button" class="close" aria-label="Close contact form"><img class="icon" src="x.svg" alt="" aria-hidden="true"></button></div>
        <form id="contact-form" method="POST" action="https://formspree.io/f/xwloqyor">
          <div class="field-row">
            <label class="field-label" for="first-name">First Name</label>
            <input id="first-name" name="first_name" type="text" autocomplete="given-name" pattern="(?=.*\p{L})[\p{L}\p{M} .’'\-]+" title="Use letters, spaces, apostrophes, periods, or hyphens." maxlength="80" required placeholder="First Name">
            <label class="field-label" for="last-name">Last Name</label>
            <input id="last-name" name="last_name" type="text" autocomplete="family-name" pattern="(?=.*\p{L})[\p{L}\p{M} .’'\-]+" title="Use letters, spaces, apostrophes, periods, or hyphens." maxlength="80" required placeholder="Last Name">
          </div>
          <div class="field-row">
            <label class="field-label" for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter an email address like you@example.com." maxlength="254" required placeholder="Email">
            <label class="field-label" for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" pattern="\+?(?:[ .\(\)\-]*[0-9]){7,15}[ .\(\)\-]*" title="Enter 7 to 15 digits. Common phone formatting is allowed." maxlength="40" required placeholder="Phone">
          </div>
          <label class="field-label" for="message">Message</label>
          <textarea id="message" name="message" rows="3" maxlength="5000" required placeholder="Message"></textarea>
          <input type="hidden" name="_subject" value="Personal Site — New Contact">
          <div class="honeypot" aria-hidden="true"><label for="website">Leave this blank</label><input id="website" name="_gotcha" type="text" tabindex="-1" autocomplete="off"></div>
          <button class="button send" type="submit">Send Message <img class="icon" src="arrow-right.svg" alt="" aria-hidden="true"></button>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </section>
    <div class="portrait-wrap"><img src="portrait.jpg" alt="Illustrated portrait of Vullnet Ameti wearing a dark suit" width="1254" height="1254"></div>
    <div class="matrix-trail" aria-hidden="true"></div>
  </main>
  <script src="script.js?v=cc9979c3d016"></script>
  <script src="matrix.js?v=2095cfff401c" defer></script>
  <script src="eyes.js?v=c172fd21fd25" defer></script>
</body>
</html>
